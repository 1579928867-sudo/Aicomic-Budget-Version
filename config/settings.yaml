# AI 漫剧生成助手 — 配置文件
# 所有值均可通过同名环境变量覆盖（前缀 AICOMIC_）

# 后端选择: "deepseek" (默认) 或 "claude"
backend: "deepseek"

deepseek:
  api_key: ""                    # 或环境变量 DEEPSEEK_API_KEY
  model: "deepseek-chat"        # deepseek-chat (V3) 或 deepseek-reasoner (R1)
  base_url: "https://api.deepseek.com"

anthropic:
  api_key: ""                    # 或环境变量 ANTHROPIC_API_KEY
  model: "claude-sonnet-5-20251001"

database:
  path: "data/aicomic.db"

doubao:
  cookie_file: "data/doubao_cookies.json"
  headless: true
  timeout_sec: 300
  poll_interval_sec: 3
  rate_limit_sec: 10
  output_dir: "data/"
  pages:
    image: "https://www.doubao.com/chat/create-image"
    video: "https://www.doubao.com/chat/create-video"
  selectors:
    image:
      prompt_input: "textarea[placeholder*='描述']"
      generate_btn: "button:has-text('生成')"
      result_img: "img[class*='result']"
      loading: "[class*='generating']"
      ratio_1_1: "[data-ratio='1:1']"
      ratio_16_9: "[data-ratio='16:9']"
      ratio_9_16: "[data-ratio='9:16']"
    video:
      prompt_input: "textarea[placeholder*='描述']"
      generate_btn: "button:has-text('生成')"
      result_video: "video"
      status_done: "[class*='success']"
      status_failed: "[class*='error']"

video:
  generator: "mock"               # mock | doubao — which VideoGenerator to use
  output_dir: "data/videos/"       # where generated video clips are saved

logging:
  level: "INFO"
