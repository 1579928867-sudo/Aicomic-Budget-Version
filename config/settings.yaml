# AI 漫剧生成助手 — 配置文件
# 所有值均可通过同名环境变量覆盖（前缀 AICOMIC_）

# 后端选择: "deepseek" (默认) 或 "claude"
backend: "deepseek"

deepseek:
  api_key: ""                    # 或环境变量 DEEPSEEK_API_KEY
  model: "deepseek-chat"        # deepseek-chat (V3) 或 deepseek-reasoner (R1)
  base_url: "https://api.deepseek.com"

anthropic:
  api_key: ""                    # 或环境变量 ANTHROPIC_API_KEY
  model: "claude-sonnet-5-20251001"

database:
  path: "data/aicomic.db"

doubao:
  cookie_file: "data/doubao_cookies.json"
  headless: true
  timeout_sec: 300
  poll_interval_sec: 3
  rate_limit_sec: 10
  output_dir: "data/"
  # Backward compat: flat selectors for DoubaoVideoGenerator (pre-v0.6 path)
  video_page_url: "https://jimeng.jianying.com/ai-tool/video/generate"
  # v0.6+ nested selectors structure
  pages:
    image: "https://www.doubao.com/chat/create-image"
    video: "https://www.doubao.com/chat/create-video"
  selectors:
    image:
      # Prompt input is a contenteditable div, NOT a textarea — use keyboard.type + Enter
      prompt_input: 'div[contenteditable="true"][role="textbox"]:has(p[data-placeholder="描述你想要的图片"])'
      generate_method: "enter"   # Press Enter to start generation (no button exists)
      # Status container — poll its text content for completion keywords
      status_container: "div.container-enLQFx"
      status_done_keywords: ["已生成", "生成成功"]
      status_failed_keywords: ["无法生成", "生成失败"]
      # Download button — downloads all 3-4 generated images at once
      download_btn: '#chat-route-main > main > div > div.flex.h-full.w-full.flex-col.items-center > div > div.relative.w-\[calc\(100\%-var\(--scrollbar-width\,9px\)\)\].flex-shrink-0.pl-16.pr-7 > div > div > div > div > button'
      # Aspect ratio: click ratio trigger button, then click menu item
      ratio_trigger: 'div[role="button"]:has(svg)'
      ratio_1_1: 'div[role="menuitem"][data-slot="dropdown-menu-item"]:has(img[src*="ratio1_1.png"])'
      ratio_16_9: 'div[role="menuitem"][data-slot="dropdown-menu-item"]:has(img[src*="ratio16_9.png"])'
      ratio_9_16: 'div[role="menuitem"][data-slot="dropdown-menu-item"]:has(img[src*="ratio9_16.png"])'
    video:
      prompt_input: "textarea[placeholder*='描述']"
      generate_btn: "button:has-text('生成')"
      result_video: "video"
      status_done: "[class*='success']"
      status_failed: "[class*='error']"

video:
  generator: "mock"               # mock | doubao — which VideoGenerator to use
  output_dir: "data/videos/"       # where generated video clips are saved

logging:
  level: "INFO"
